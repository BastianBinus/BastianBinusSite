<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Color Composer Mockup – Preview</title>
<style>
  html, body {
    margin: 0;
    height: 100%; /* Pflicht für iframe height:100% Vererbungskette, siehe SSG-Widget */
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #090c12; /* nur Preview-Hintergrund, nicht Teil des Widgets */
  }

  /*
    ===========================================================
    AB HIER: Widget-Code für work.html. --mock-* Variablen wieder
    mit var(--dein-token, fallback) — Fallbacks anpassen/entfernen.
    ===========================================================
  */
  .cc-mockup {
    /* Card-Optik 1:1 wie das echte Widget, nur die Farbwerte gedreht */
    --mock-bg: var(--color-surface, #141923);
    --mock-border: var(--color-border, #262d3a);
    --mock-field: var(--color-field, #1b212c);
    --mock-text: var(--color-text, #e5e9f0);
    --mock-text-dim: var(--color-text-muted, #7b8797);
    --mock-accent: var(--color-primary, #40bfbf);

    width: 100%;
    max-width: 640px;
    max-height: 100%;
    aspect-ratio: 16 / 10;
    margin: auto; /* zentriert die Karte selbst, falls Container grösser als max-width/aspect-ratio ist */
    background: var(--mock-bg);
    border-radius: var(--radius-pill, 24px);
    box-sizing: border-box;
    padding: clamp(16px, 4%, 32px);
    display: flex;
    flex-direction: column;
    font-family: 'Inter', sans-serif;
    color: var(--mock-text);
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }

  .cc-mockup__title {
    text-align: center;
    font-size: clamp(1rem, 3vw, 1.3rem);
    font-weight: 600;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--mock-text);
    margin-bottom: clamp(14px, 4%, 28px);
    flex-shrink: 0;
  }

  .cc-mockup__body {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(16px, 5%, 40px);
    align-items: start;
  }

  /* Slider-Reihen */
  .cc-mockup__controls { display: flex; flex-direction: column; gap: 12px; }
  .cc-mockup__row { display: flex; flex-direction: column; gap: 4px; }
  .cc-mockup__row-label {
    display: flex; justify-content: space-between;
    font-size: .65rem; color: var(--mock-text-dim);
  }
  .cc-mockup__row-label span:last-child { font-family: monospace; }

  .cc-mockup__track {
    position: relative;
    height: 10px;
    border-radius: 999px;
    border: 1px solid var(--mock-border);
    box-sizing: border-box;
    overflow: hidden;
  }
  .cc-mockup__thumb {
    position: absolute;
    top: 50%;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--mock-bg);
    box-shadow: 0 1px 4px rgba(0,0,0,.5);
    transform: translate(-50%, -50%);
  }

  /* Preview + Outputs */
  .cc-mockup__preview {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(10px, 3%, 18px);
  }
  .cc-mockup__swatch {
    width: 100%;
    aspect-ratio: 1;
    max-height: clamp(60px, 22vw, 140px);
    max-width: clamp(60px, 22vw, 140px);
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,.35);
  }
  .cc-mockup__fields { width: 100%; display: flex; flex-direction: column; gap: 8px; }
  .cc-mockup__field {
    background: var(--mock-field);
    border: 1px solid var(--mock-border);
    border-radius: 10px;
    padding: 6px 10px;
    font-family: monospace;
    font-size: clamp(.6rem, 1.6vw, .75rem);
    color: var(--mock-text);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .cc-mockup__field svg {
    width: 13px; height: 13px;
    fill: var(--mock-text-dim);
    flex-shrink: 0;
  }

  /* Pause on hover — Timer wird per JS pausiert, siehe Script */
  .cc-mockup.is-paused .cc-mockup__thumb { transition: none; }
</style>
</head>
<body>

<div class="cc-mockup" id="ccMockup">
  <div class="cc-mockup__title">Color Composer</div>

  <div class="cc-mockup__body">
    <div class="cc-mockup__controls">
      <div class="cc-mockup__row">
        <div class="cc-mockup__row-label"><span>Hue</span><span id="hueVal">0°</span></div>
        <div class="cc-mockup__track" id="hueTrack" style="background:linear-gradient(to right, hsl(0 100% 50%), hsl(60 100% 50%), hsl(120 100% 50%), hsl(180 100% 50%), hsl(240 100% 50%), hsl(300 100% 50%), hsl(360 100% 50%));">
          <div class="cc-mockup__thumb" id="hueThumb"></div>
        </div>
      </div>
      <div class="cc-mockup__row">
        <div class="cc-mockup__row-label"><span>Saturation</span><span>70%</span></div>
        <div class="cc-mockup__track" id="satTrack">
          <div class="cc-mockup__thumb" style="left:70%"></div>
        </div>
      </div>
      <div class="cc-mockup__row">
        <div class="cc-mockup__row-label"><span>Lightness</span><span>55%</span></div>
        <div class="cc-mockup__track" id="lightTrack">
          <div class="cc-mockup__thumb" style="left:55%"></div>
        </div>
      </div>
    </div>

    <div class="cc-mockup__preview">
      <div class="cc-mockup__swatch" id="swatch"></div>
      <div class="cc-mockup__fields">
        <div class="cc-mockup__field">
          <span id="hexOut">#000000</span>
          <svg viewBox="0 0 16 16"><path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/><path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/></svg>
        </div>
        <div class="cc-mockup__field">
          <span id="rgbOut">rgb(0, 0, 0)</span>
          <svg viewBox="0 0 16 16"><path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/><path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/></svg>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // Gleiche Umrechnung wie im echten Color Composer, nur vanilla statt React-State
  function hslToRgbAndHex(h, s, l) {
    const sN = s / 100, lN = l / 100;
    const k = n => (n + h / 30) % 12;
    const a = sN * Math.min(lN, 1 - lN);
    const f = n => lN - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    const r = Math.round(255 * f(0)), g = Math.round(255 * f(8)), b = Math.round(255 * f(4));
    const toHex = x => x.toString(16).padStart(2, '0');
    return { hex: `#${toHex(r)}${toHex(g)}${toHex(b)}`, rgb: `rgb(${r}, ${g}, ${b})` };
  }

  const el = document.getElementById('ccMockup');
  const swatch = document.getElementById('swatch');
  const hexOut = document.getElementById('hexOut');
  const rgbOut = document.getElementById('rgbOut');
  const hueVal = document.getElementById('hueVal');
  const hueThumb = document.getElementById('hueThumb');
  const satTrack = document.getElementById('satTrack');
  const lightTrack = document.getElementById('lightTrack');

  const SAT = 70, LIGHT = 55;
  // Gradients werden jetzt in tick() live nachgeführt, nicht mehr hier statisch gesetzt

  let hue = 0;
  let paused = false;
  el.addEventListener('mouseenter', () => paused = true);
  el.addEventListener('mouseleave', () => paused = false);

  function tick() {
    if (!paused) {
      hue = (hue + 0.3) % 360; // Geschwindigkeit: kleiner = langsamer
      const { hex, rgb } = hslToRgbAndHex(hue, SAT, LIGHT);
      swatch.style.background = hex;
      hexOut.textContent = hex.toUpperCase();
      rgbOut.textContent = rgb;
      hueVal.textContent = Math.round(hue) + '°';
      hueThumb.style.left = (hue / 360 * 100) + '%';
      satTrack.style.background = `linear-gradient(to right, hsl(${hue} 0% ${LIGHT}%), hsl(${hue} 100% ${LIGHT}%))`;
      lightTrack.style.background = `linear-gradient(to right, hsl(${hue} ${SAT}% 0%), hsl(${hue} ${SAT}% 50%), hsl(${hue} ${SAT}% 100%))`;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>

</body>
</html>
